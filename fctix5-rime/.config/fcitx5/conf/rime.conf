# 预编辑模式
# PreeditMode="Composing text"
# 共享输入状态
# InputState=All
# 将嵌入式预编辑文本的光标固定在开头
# PreeditCursorPositionAtBeginning=True
# 切换输入法时的行为
SwitchInputMethodBehavior="Commit raw input"
# 重新部署
# Deploy=
# 同步
# Synchronize=
# 用 schema 的 abbrev 作为 label 提示
LatinModeNameFromSchema=True
# 大写锁定的 label 提示
CapsLockLabelPrompt=A
# 中文模式图标
fcitxRimeIconName=fctix_cn
# ASCII 模式图标
fcitxRimeANSCIIIconName=fctix_en
# 大写锁定图标
fcitxRimeCapsLockIconName=fcitx_EN

